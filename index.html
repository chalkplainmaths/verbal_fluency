<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>Verbal Fluency Test</title>
	<!--<link rel="stylesheet" href="./index.css">-->
</head>
<body>
	<script src="./words.js"></script>
	<script src="./mylib.js"></script>
	<script src="./pavlovia.js"></script>
	<!--<script src="./old_pavlovia.js"></script>-->
	<script src="./fluency.js"></script>
	<script>
const fluency = new Fluency("P");

let participant_id;
let pavlovia = new Pavlovia();

pavlovia.start()
.then( () => {
	return get_submission("Participant ID:");
}).then( (id) => {
	participant_id = id;
	return wait_button("Start");
}).then( () => {
	const audio_indicator = document.body.appendChild(document.createElement("p"));
	const recog_indicator = document.body.appendChild(document.createElement("p"));
	return fluency.get_speech(10000, true, recog_indicator, audio_indicator);
}).then( () => {
	console.log(fluency.transcript);
	const csv = fluency.gen_csv();
	const audio_filename = participant_id + "." + fluency.mime_type.split("/")[1];
	const text = document.body.appendChild(document.createElement("p"));
	text.innerHTML = csv;
	console.log(csv);
	const link = document.body.appendChild(document.createElement("a"));
  link.innerHTML = "local download";
  link.download = audio_filename;
  link.href = URL.createObjectURL(fluency.audio_blob);
	pavlovia.upload_data(participant_id + ".csv", csv);
	return pavlovia.upload_media(audio_filename, fluency.audio_blob);
}).then( () => {
	return pavlovia.end();
});
	</script>
</body>
</html>
